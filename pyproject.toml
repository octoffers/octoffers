[project]
name = "octoffers"
version = "0.1.0"
description = ""
authors = [{ name = "init64.org" }]
license = { text = "BSD 3-Clause License" }
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fire==0.7.0",
    "selenium==4.36.0",
    "requests==2.31.0",
    "pytest==8.1.1",
    "undetected-chromedriver==3.5.5",
    "chrome-version==0.4.0",
    "webdriver-manager==4.0.2",
    "python-dotenv==1.1.1"
]

[project.scripts]
octoffers = "octoffers:main"

[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"
